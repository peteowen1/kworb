name: Backfill track pages (B6)

# One-off Stage 4 backfill B6 (docs/plans/kworb-db.md 3.6), scope "recent only" (Pete, 15 Nov 2026): the live track page of
# every track on the global daily chart since `since`, about 1,340 pages x 3 s = about 67 min. Uploads one tar to this
# month's kworb-raw-YYYY-MM release on mediadata; the nightly capture-raw rebuild then parses it into track_chart.
# Shares the capture-raw concurrency group so it never hits kworb at the same time as the daily capture.

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Tracks on the global daily chart since this date (YYYY-MM-DD)'
        default: '2025-10-01'
      max:
        description: 'Cap on pages (blank = all; a small number for a trial)'
        default: ''

permissions:
  contents: read

concurrency:
  group: capture-raw
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      MEDIADATA_REPO: peteowen1/mediadata
      KWORB_SINCE: ${{ inputs.since }}
      KWORB_MAX: ${{ inputs.max }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the token can write to mediadata
        run: |
          perm=$(gh api "repos/$MEDIADATA_REPO" --jq '.permissions.push')
          echo "push permission on $MEDIADATA_REPO: $perm"
          test "$perm" = "true"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = TRUE)
          remotes::install_local(".", dependencies = FALSE)
        shell: Rscript {0}

      - name: Fetch and upload (fails on a 429/403 stop, over 1% failed pages, or an unverified upload)
        run: Rscript inst/scripts/backfill_tracks.R
