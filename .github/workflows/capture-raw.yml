name: Capture raw kworb pages

# Stage 1 of docs/plans/kworb-db.md. Saves the 77 country daily charts,
# global_daily_totals, the global weekly chart and weekly totals, and artists.html exactly as received, and uploads one tar
# plus manifest to a monthly release of the PRIVATE peteowen1/mediadata repo.

on:
  schedule:
    # 21:30 UTC daily, shortly after kworb has published the day's charts
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-raw
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # capture: 82 requests + 200 track pages x 3 s, about 14 min (10 Nov); the month rebuild: about 0.4 min per day of captures (9 Nov), ~12 min by the 31st,
    # plus track pages (0.13 s each, 11 Nov: 200 a day, ~14 min by the 31st) when the parse cache below is missing
    timeout-minutes: 60

    env:
      # Needs write access to peteowen1/mediadata (a repo-scoped PAT; the
      # default GITHUB_TOKEN cannot reach another repository).
      GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      MEDIADATA_REPO: peteowen1/mediadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the token can write to mediadata
        run: |
          perm=$(gh api "repos/$MEDIADATA_REPO" --jq '.permissions.push')
          echo "push permission on $MEDIADATA_REPO: $perm"
          test "$perm" = "true"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = TRUE)
          remotes::install_local(".", dependencies = FALSE)
        shell: Rscript {0}

      - name: Capture and upload (fails on any failed page or upload)
        run: Rscript inst/scripts/capture_raw.R

      # Stage 2: rebuild this capture month's tables from every raw tar of the month (today's included) and replace
      # the month's assets on mediadata release kworb-db. Runs only if the capture step succeeded. Known edge: a manual
      # dispatch that starts before and ends after midnight UTC on a month's last day files pages stamped in the new month
      # under the old month's tar; the 21:30 UTC schedule (a ~5 min capture) never does that.
      # Each raw file's parsed rows (data/db/_parsed/<file>__v<parser version>.parquet) are kept between runs, so a run parses
      # only the day's new pages. A missing or stale cache only costs time: every file it lacks is parsed again.
      - name: Capture month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the parse cache
        uses: actions/cache@v4
        with:
          path: data/db/_parsed
          key: kworb-parsed-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: kworb-parsed-${{ steps.month.outputs.month }}-

      - name: Rebuild and publish this month's tables (fails on any parse, coverage or upload problem)
        run: |
          month=$(date -u +%Y-%m)
          mkdir -p data/raw_tars data/raw
          gh release download "kworb-raw-$month" -R "$MEDIADATA_REPO" -p 'kworb-raw-2*.tar' -D data/raw_tars
          for t in data/raw_tars/*.tar; do tar -xf "$t" -C data/raw; done
          echo "raw files for $month: $(ls data/raw | wc -l)"
          Rscript inst/scripts/parse_raw.R data/raw data/db
          Rscript inst/scripts/publish_db.R data/db "$month"
